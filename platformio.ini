[platformio]
default_envs = m5stack-sticks3

[env:m5stack-sticks3]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.arduino.memory_type = qio_opi

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    https://github.com/m5stack/M5Unified.git#4fb444784c85791e0b0207701392b42be234b2e7
    https://github.com/m5stack/M5PM1.git#1.0.7
    h2zero/NimBLE-Arduino @ 2.5.1
    bblanchon/ArduinoJson @ 7.4.3

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<morse_decoder.cpp>
    +<command_mapper.cpp>
    +<straight_key_input.cpp>
    +<tone_detector.cpp>
build_flags =
    -std=c++17
